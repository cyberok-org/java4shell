# Optional JSON setup, only if your existing WAF policy does not select JSON.
# Include before CVE-2026-114938-java4shell.conf. Keep your existing body limits
# and request-body parsing-error handling; this file does not replace them.
SecRequestBodyAccess On
SecRule REQUEST_HEADERS:Content-Type "@rx \A(?i:application/(?:[a-z0-9.+-]+\+)?json)(?:[ \t]*;|[ \t]*\z)" \
    "id:11493810,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=JSON"
