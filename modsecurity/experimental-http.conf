# OPTIONAL experimental HTTP coverage. Not included by the core rules.
# IDs 11493811-11493816. Parsed query/form/cookie values; selected custom headers.
# All rules are pass + log. Review field semantics, logging and false positives.
# Requires request-body access for form/text rules; see README.md.

# ModSecurity 2.x does not expose text/plain REQUEST_BODY automatically.
# Phase-1 setup for that media type only; no detector alert from this rule.
SecRule REQUEST_HEADERS:Content-Type "@rx \A(?i:text/plain)(?:[ \t]*;|\z)" \
    "id:11493817,phase:1,pass,nolog,t:none,ctl:requestBodyAccess=On,ctl:forceRequestBodyVariable=On"

SecRule ARGS_GET "@rx \A(?:(?:[A-Za-z0-9+/]{64})+(?:=|[A-Za-z0-9+/]=|==|[A-Za-z0-9+/]{2}=|[A-Za-z0-9+/]==|===)|(?:[A-Za-z0-9_-]{64})+(?:=|[A-Za-z0-9_-]=|==|[A-Za-z0-9_-]{2}=|[A-Za-z0-9_-]==|===))\z" \
    "id:11493811,phase:1,pass,log,t:none,msg:'Java4Shell EXPERIMENTAL: Query parameter value indicator',tag:'java4shell-experimental',severity:'NOTICE'"

SecRule REQBODY_PROCESSOR "@streq URLENCODED" \
    "id:11493812,phase:2,pass,log,t:none,chain,msg:'Java4Shell EXPERIMENTAL: Form parameter value indicator',tag:'java4shell-experimental',severity:'NOTICE'"
    SecRule ARGS_POST "@rx \A(?:(?:[A-Za-z0-9+/]{64})+(?:=|[A-Za-z0-9+/]=|==|[A-Za-z0-9+/]{2}=|[A-Za-z0-9+/]==|===)|(?:[A-Za-z0-9_-]{64})+(?:=|[A-Za-z0-9_-]=|==|[A-Za-z0-9_-]{2}=|[A-Za-z0-9_-]==|===))\z" "t:none"

SecRule REQUEST_COOKIES "@rx \A(?:(?:[A-Za-z0-9+/]{64})+(?:=|[A-Za-z0-9+/]=|==|[A-Za-z0-9+/]{2}=|[A-Za-z0-9+/]==|===)|(?:[A-Za-z0-9_-]{64})+(?:=|[A-Za-z0-9_-]=|==|[A-Za-z0-9_-]{2}=|[A-Za-z0-9_-]==|===))\z" \
    "id:11493813,phase:1,pass,log,t:none,msg:'Java4Shell EXPERIMENTAL: Cookie value indicator',tag:'java4shell-experimental',severity:'NOTICE'"

SecRule REQUEST_HEADERS:Authorization "@rx \A(?i:bearer)[ \t]+(?:[A-Za-z0-9_-]+\.(?:[A-Za-z0-9_-]{64})+(?:=|[A-Za-z0-9_-]=|==|[A-Za-z0-9_-]{2}=|[A-Za-z0-9_-]==|===)\.[A-Za-z0-9_-]+|(?:[A-Za-z0-9_-]+\.){2}(?:[A-Za-z0-9_-]{64})+(?:=|[A-Za-z0-9_-]=|==|[A-Za-z0-9_-]{2}=|[A-Za-z0-9_-]==|===))[ \t]*\z" \
    "id:11493814,phase:1,pass,log,t:none,msg:'Java4Shell EXPERIMENTAL: JWT second or third segment indicator',tag:'java4shell-experimental',severity:'NOTICE'"

SecRule REQUEST_HEADERS:X-Auth-Token|REQUEST_HEADERS:X-Api-Key|REQUEST_HEADERS:X-CSRF-Token "@rx \A(?:(?:[A-Za-z0-9+/]{64})+(?:=|[A-Za-z0-9+/]=|==|[A-Za-z0-9+/]{2}=|[A-Za-z0-9+/]==|===)|(?:[A-Za-z0-9_-]{64})+(?:=|[A-Za-z0-9_-]=|==|[A-Za-z0-9_-]{2}=|[A-Za-z0-9_-]==|===))\z" \
    "id:11493815,phase:1,pass,log,t:none,msg:'Java4Shell EXPERIMENTAL: Selected custom-header value indicator',tag:'java4shell-experimental',severity:'NOTICE'"

SecRule REQUEST_HEADERS:Content-Type "@rx \A(?i:text/plain)(?:[ \t]*;|\z)" \
    "id:11493816,phase:2,pass,log,t:none,chain,msg:'Java4Shell EXPERIMENTAL: Plain-text body indicator',tag:'java4shell-experimental',severity:'NOTICE'"
    SecRule REQUEST_BODY "@rx \A(?:(?:[A-Za-z0-9+/]{64})+(?:=|[A-Za-z0-9+/]=|==|[A-Za-z0-9+/]{2}=|[A-Za-z0-9+/]==|===)|(?:[A-Za-z0-9_-]{64})+(?:=|[A-Za-z0-9_-]=|==|[A-Za-z0-9_-]{2}=|[A-Za-z0-9_-]==|===))\z" "t:none"
